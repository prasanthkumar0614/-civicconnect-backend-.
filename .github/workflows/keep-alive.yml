name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3 * * 0,3'
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Postgres
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -c "SELECT 1;"
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
